<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         상단 헤더
    ========================== -->
    <header class="top-bar">

        <div class="profile">
            <img src="profile.png" alt="까치치킨사장님">
        </div>

        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

    </header>

    <!-- 검은색 선 -->
    <div class="header-line"></div>


    <!-- =========================
         전체 레이아웃
    ========================== -->
    <div class="site-layout">

        <!-- 사이드바 -->
        <aside class="sidebar">

            <button
                class="menu-item active"
                id="newsMenu"
                type="button"
                onclick="showNewsHome()"
            >
                소식
            </button>

            <button
                class="menu-item"
                id="donationMenu"
                type="button"
                onclick="showDonation()"
            >
                기부
            </button>

            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                고급소식 🔒
            </button>

            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                영상미리보기 🔒
            </button>

            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

        </aside>


        <!-- =========================
             오른쪽 메인 화면
        ========================== -->
        <main class="main-content">


            <!-- =====================
                 소식 메인
            ====================== -->
            <div id="newsHome" class="page">

                <h1 class="page-heading">
                    소식
                </h1>

                <div class="news-box">

                    <h2>
                        까치치킨사장님 공식 소식
                    </h2>

                    <p>
                        새로운 소식과 공지사항이 이곳에 표시됩니다.
                    </p>

                    <button
                        class="detail-button"
                        type="button"
                        onclick="showNewsDetail()"
                    >
                        소식 자세히 보러가기
                    </button>

                </div>

            </div>


            <!-- =====================
                 소식 전용 화면
            ====================== -->
            <div id="newsDetail" class="page">

                <button
                    class="back-button"
                    type="button"
                    onclick="showNewsHome()"
                >
                    ← 소식으로 돌아가기
                </button>

                <div class="detail-page">

                    <h1>
                        소식 전용 화면
                    </h1>

                    <p>
                        이곳이 소식 전용 화면입니다.
                    </p>

                </div>

            </div>


            <!-- =====================
                 기부 화면
            ====================== -->
            <div id="donationPage" class="page">

                <h1 class="page-heading">
                    기부
                </h1>

            </div>


        </main>

    </div>


    <!-- =========================
         JavaScript
         HTML 안에 직접 넣음
    ========================== -->
    <script>

        const newsHome = document.getElementById("newsHome");
        const newsDetail = document.getElementById("newsDetail");
        const donationPage = document.getElementById("donationPage");

        const newsMenu = document.getElementById("newsMenu");
        const donationMenu = document.getElementById("donationMenu");


        function hideAllPages() {

            newsHome.style.display = "none";
            newsDetail.style.display = "none";
            donationPage.style.display = "none";

        }


        function showNewsHome() {

            hideAllPages();

            newsHome.style.display = "block";

            newsMenu.classList.add("active");
            donationMenu.classList.remove("active");

        }


        function showNewsDetail() {

            hideAllPages();

            newsDetail.style.display = "block";

        }


        function showDonation() {

            hideAllPages();

            donationPage.style.display = "block";

            donationMenu.classList.add("active");
            newsMenu.classList.remove("active");

        }


        // 처음 사이트에 들어왔을 때
        showNewsHome();

    </script>

</body>
</html>
