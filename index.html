<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="./style.css?v=5">
</head>

<body>

    <!-- ==================================================
         상단 헤더
    ================================================== -->

    <header class="top-bar">

        <div class="profile">
            <img src="profile.png" alt="까치치킨사장님">
        </div>

        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

    </header>

    <div class="header-line"></div>


    <!-- ==================================================
         전체 사이트
    ================================================== -->

    <div class="site-layout">


        <!-- ==================================================
             왼쪽 사이드바
        ================================================== -->

        <aside class="sidebar">

            <button
                id="newsMenu"
                class="menu-item active"
                type="button"
            >
                소식
            </button>


            <button
                id="donationMenu"
                class="menu-item"
                type="button"
            >
                기부
            </button>


            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                <span>고급소식</span>
                <span>🔒</span>
            </button>


            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                <span>영상미리보기</span>
                <span>🔒</span>
            </button>


            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>


            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

        </aside>


        <!-- ==================================================
             오른쪽 메인 영역
        ================================================== -->

        <main class="main-content">


            <!-- ==================================================
                 1. 소식 소개 화면
            ================================================== -->

            <section
                id="newsIntro"
                class="page active-page"
            >

                <h1 class="page-heading">
                    소식
                </h1>


                <div class="news-intro-box">

                    <h2>
                        까치치킨사장님 공식 소식
                    </h2>

                    <p>
                        새로운 소식과 공지사항이 이곳에 표시됩니다.
                    </p>

                    <button
                        id="openNewsListButton"
                        class="detail-button"
                        type="button"
                    >
                        소식 자세히 보러가기
                    </button>

                </div>

            </section>


            <!-- ==================================================
                 2. 소식 목록
            ================================================== -->

            <section
                id="newsListPage"
                class="page"
            >

                <div class="page-top">

                    <div>
                        <h1 class="page-heading">
                            소식
                        </h1>

                        <p class="page-description">
                            까치치킨사장님의 소식과 공지사항입니다.
                        </p>
                    </div>

                    <button
                        id="openWriteButton"
                        class="write-button"
                        type="button"
                    >
                        + 소식 작성
                    </button>

                </div>


                <!-- 소식 목록 -->
                <div id="newsList"></div>

            </section>


            <!-- ==================================================
                 3. 소식 상세
            ================================================== -->

            <section
                id="newsDetailPage"
                class="page"
            >

                <button
                    id="backToNewsListButton"
                    class="back-button"
                    type="button"
                >
                    ← 소식 목록
                </button>


                <article
                    id="newsDetailContent"
                    class="news-detail-box"
                >
                </article>

            </section>


            <!-- ==================================================
                 4. 소식 작성
            ================================================== -->

            <section
                id="writePage"
                class="page"
            >

                <button
                    id="backFromWriteButton"
                    class="back-button"
                    type="button"
                >
                    ← 소식 목록
                </button>


                <div class="write-box">

                    <h1 class="write-title">
                        소식 작성
                    </h1>


                    <label
                        for="authorInput"
                        class="form-label"
                    >
                        작성자
                    </label>

                    <input
                        id="authorInput"
                        class="form-input"
                        type="text"
                        placeholder="예: 까치치킨사장님"
                        autocomplete="off"
                    >


                    <label
                        for="titleInput"
                        class="form-label"
                    >
                        제목
                    </label>

                    <input
                        id="titleInput"
                        class="form-input"
                        type="text"
                        placeholder="소식 제목을 입력하세요"
                        autocomplete="off"
                    >


                    <label
                        for="contentInput"
                        class="form-label"
                    >
                        내용
                    </label>

                    <textarea
                        id="contentInput"
                        class="form-textarea"
                        placeholder="소식 내용을 입력하세요"
                    ></textarea>


                    <div class="write-buttons">

                        <button
                            id="cancelWriteButton"
                            class="cancel-button"
                            type="button"
                        >
                            취소
                        </button>

                        <button
                            id="saveNewsButton"
                            class="save-button"
                            type="button"
                        >
                            소식 등록
                        </button>

                    </div>

                </div>

            </section>


            <!-- ==================================================
                 5. 기부
            ================================================== -->

            <section
                id="donationPage"
                class="page"
            >

                <h1 class="page-heading">
                    기부
                </h1>

            </section>

        </main>

    </div>


    <!-- JavaScript -->
    <script src="./script.js?v=5"></script>

</body>
</html>
