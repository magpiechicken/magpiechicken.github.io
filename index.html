<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="./style.css?v=12">
</head>

<body>

    <!-- =========================
         상단 헤더
    ========================== -->

    <header class="top-bar">

        <div class="profile">
            <img src="./profile.png" alt="까치치킨사장님">
        </div>

        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

    </header>

    <div class="header-line"></div>


    <!-- =========================
         전체 사이트
    ========================== -->

    <div class="site-layout">


        <!-- =========================
             왼쪽 사이드바
        ========================== -->

        <aside class="sidebar">

            <button
                id="menu-news"
                class="menu-item active"
                type="button"
            >
                소식
            </button>

            <button
                id="menu-donation"
                class="menu-item"
                type="button"
            >
                기부
            </button>

            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                고급소식 🔒
            </button>

            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                영상미리보기 🔒
            </button>

            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

        </aside>


        <!-- =========================
             오른쪽 메인
        ========================== -->

        <main class="main-content">


            <!-- =========================
                 1. 소식 소개
            ========================== -->

            <section
                id="screen-news-intro"
                class="screen visible"
            >

                <h1 class="page-heading">
                    소식
                </h1>

                <div class="intro-box">

                    <h2>
                        까치치킨사장님 공식 소식
                    </h2>

                    <p>
                        새로운 소식과 공지사항이 이곳에 표시됩니다.
                    </p>

                    <button
                        id="show-news-list"
                        class="orange-button"
                        type="button"
                    >
                        소식 자세히 보러가기
                    </button>

                </div>

            </section>


            <!-- =========================
                 2. 소식 목록
            ========================== -->

            <section
                id="screen-news-list"
                class="screen"
            >

                <div class="list-header">

                    <div>

                        <h1 class="page-heading">
                            소식
                        </h1>

                        <p class="page-subtitle">
                            까치치킨사장님의 소식과 공지사항입니다.
                        </p>

                    </div>


                    <button
                        id="show-write"
                        class="orange-small-button"
                        type="button"
                    >
                        + 소식 작성
                    </button>

                </div>


                <div id="news-list-container"></div>

            </section>


            <!-- =========================
                 3. 소식 상세
            ========================== -->

            <section
                id="screen-news-detail"
                class="screen"
            >

                <button
                    id="back-to-list"
                    class="white-button"
                    type="button"
                >
                    ← 소식 목록
                </button>

                <article
                    id="news-detail-container"
                    class="detail-box"
                ></article>

                <button
                    id="delete-news"
                    class="delete-button"
                    type="button"
                >
                    소식 삭제
                </button>

            </section>


            <!-- =========================
                 4. 소식 작성
            ========================== -->

            <section
                id="screen-write"
                class="screen"
            >

                <button
                    id="back-from-write"
                    class="white-button"
                    type="button"
                >
                    ← 소식 목록
                </button>

                <div class="write-box">

                    <h1>
                        소식 작성
                    </h1>

                    <label for="input-author">
                        작성자
                    </label>

                    <input
                        id="input-author"
                        type="text"
                        placeholder="예: 까치치킨사장님"
                        autocomplete="off"
                    >

                    <label for="input-title">
                        제목
                    </label>

                    <input
                        id="input-title"
                        type="text"
                        placeholder="소식 제목"
                        autocomplete="off"
                    >

                    <label for="input-content">
                        내용
                    </label>

                    <textarea
                        id="input-content"
                        placeholder="소식 내용을 입력하세요."
                    ></textarea>

                    <div class="write-actions">

                        <button
                            id="cancel-write"
                            class="white-button"
                            type="button"
                        >
                            취소
                        </button>

                        <button
                            id="save-write"
                            class="orange-small-button"
                            type="button"
                        >
                            소식 등록
                        </button>

                    </div>

                </div>

            </section>


            <!-- =========================
                 5. 기부
            ========================== -->

            <section
                id="screen-donation"
                class="screen"
            >

                <h1 class="page-heading">
                    기부
                </h1>

            </section>

        </main>

    </div>


    <!-- ==================================================
         Supabase JavaScript
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* ==================================================
           Supabase 연결
        ================================================== */

        const SUPABASE_URL =
            "https://kxrjevmxayolcqcgmixz.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_KrmPM2G4nuS1JXOAvnp-cA_Ik1nuYqS";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==================================================
           현재 보고 있는 소식
        ================================================== */

        let currentNewsId = null;


        /* ==================================================
           화면
        ================================================== */

        const introScreen =
            document.getElementById("screen-news-intro");

        const listScreen =
            document.getElementById("screen-news-list");

        const detailScreen =
            document.getElementById("screen-news-detail");

        const writeScreen =
            document.getElementById("screen-write");

        const donationScreen =
            document.getElementById("screen-donation");


        /* ==================================================
           메뉴
        ================================================== */

        const newsMenu =
            document.getElementById("menu-news");

        const donationMenu =
            document.getElementById("menu-donation");


        /* ==================================================
           모든 화면 숨기기
        ================================================== */

        function hideScreens() {

            introScreen.classList.remove("visible");
            listScreen.classList.remove("visible");
            detailScreen.classList.remove("visible");
            writeScreen.classList.remove("visible");
            donationScreen.classList.remove("visible");

        }


        /* ==================================================
           소식 메뉴 활성화
        ================================================== */

        function activateNewsMenu() {

            newsMenu.classList.add("active");
            donationMenu.classList.remove("active");

        }


        /* ==================================================
           기부 메뉴 활성화
        ================================================== */

        function activateDonationMenu() {

            donationMenu.classList.add("active");
            newsMenu.classList.remove("active");

        }


        /* ==================================================
           소식 소개
        ================================================== */

        function openNewsIntro() {

            hideScreens();

            introScreen.classList.add("visible");

            activateNewsMenu();

            scrollTop();

        }


        /* ==================================================
           소식 목록 열기
        ================================================== */

        async function openNewsList() {

            hideScreens();

            listScreen.classList.add("visible");

            activateNewsMenu();

            scrollTop();

            await renderNews();

        }


        /* ==================================================
           작성 화면
        ================================================== */

        function openWriteScreen() {

            hideScreens();

            writeScreen.classList.add("visible");

            activateNewsMenu();

            scrollTop();

        }


        /* ==================================================
           기부
        ================================================== */

        function openDonation() {

            hideScreens();

            donationScreen.classList.add("visible");

            activateDonationMenu();

            scrollTop();

        }


        /* ==================================================
           Supabase에서 소식 가져오기
        ================================================== */

        async function getNews() {

            const {
                data,
                error
            } = await supabaseClient
                .from("news")
                .select(
                    "id, author, title, content, created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "소식 불러오기 오류:",
                    error
                );

                alert(
                    "소식을 불러오지 못했습니다.\n\n"
                    + error.message
                );

                return [];

            }


            return data || [];

        }


        /* ==================================================
           날짜 표시
        ================================================== */

        function formatDate(value) {

            const date =
                new Date(value);


            if (Number.isNaN(date.getTime())) {

                return "";

            }


            return (
                date.getFullYear()
                + "."
                + String(
                    date.getMonth() + 1
                ).padStart(2, "0")
                + "."
                + String(
                    date.getDate()
                ).padStart(2, "0")
            );

        }


        /* ==================================================
           소식 목록
        ================================================== */

        async function renderNews() {

            const container =
                document.getElementById(
                    "news-list-container"
                );


            container.innerHTML = `
                <div class="empty-box">
                    <div class="empty-title">
                        불러오는 중...
                    </div>
                </div>
            `;


            const newsList =
                await getNews();


            /* 소식이 없는 경우 */

            if (newsList.length === 0) {

                container.innerHTML = `

                    <div class="empty-box">

                        <div class="empty-title">
                            소식 없음
                        </div>

                        <div class="empty-description">
                            현재 등록된 소식이 없습니다.
                        </div>

                    </div>

                `;

                return;

            }


            /* 소식 목록 */

            container.innerHTML = "";


            const list =
                document.createElement("div");

            list.className = "news-list";


            newsList.forEach(function(news) {

                const row =
                    document.createElement("button");

                row.type = "button";

                row.className = "news-row";


                row.innerHTML = `

                    <span class="news-author">
                        (${escapeHTML(news.author)})
                    </span>

                    <span class="news-title">
                        ${escapeHTML(news.title)}
                    </span>

                    <span class="news-date">
                        ${formatDate(news.created_at)}
                    </span>

                `;


                row.addEventListener(
                    "click",
                    function() {

                        openNewsDetail(news.id);

                    }
                );


                list.appendChild(row);

            });


            container.appendChild(list);

        }


        /* ==================================================
           특정 소식 상세보기
        ================================================== */

        async function openNewsDetail(newsId) {

            const {
                data: news,
                error
            } = await supabaseClient
                .from("news")
                .select(
                    "id, author, title, content, created_at"
                )
                .eq("id", newsId)
                .single();


            if (error) {

                console.error(
                    "소식 상세 불러오기 오류:",
                    error
                );

                alert(
                    "소식을 불러오지 못했습니다.\n\n"
                    + error.message
                );

                return;

            }


            currentNewsId =
                news.id;


            hideScreens();

            detailScreen.classList.add("visible");

            activateNewsMenu();


            const detailContainer =
                document.getElementById(
                    "news-detail-container"
                );


            detailContainer.innerHTML = `

                <div class="detail-author">
                    (${escapeHTML(news.author)})
                </div>

                <div class="detail-title-line">

                    <h1 class="detail-title">
                        ${escapeHTML(news.title)}
                    </h1>

                    <span class="detail-date">
                        ${formatDate(news.created_at)}
                    </span>

                </div>

                <div class="detail-content">
                    ${escapeHTML(
                        news.content
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}
                </div>

            `;


            scrollTop();

        }


        /* ==================================================
           소식 등록
        ================================================== */

        async function saveNews() {

            const author =
                document
                    .getElementById("input-author")
                    .value
                    .trim();


            const title =
                document
                    .getElementById("input-title")
                    .value
                    .trim();


            const content =
                document
                    .getElementById("input-content")
                    .value
                    .trim();


            if (!author) {

                alert(
                    "작성자를 입력해주세요."
                );

                return;

            }


            if (!title) {

                alert(
                    "제목을 입력해주세요."
                );

                return;

            }


            if (!content) {

                alert(
                    "내용을 입력해주세요."
                );

                return;

            }


            const button =
                document.getElementById(
                    "save-write"
                );


            button.disabled = true;

            button.textContent =
                "등록 중...";


            const {
                error
            } = await supabaseClient
                .from("news")
                .insert({
                    author: author,
                    title: title,
                    content: content
                });


            button.disabled = false;

            button.textContent =
                "소식 등록";


            if (error) {

                console.error(
                    "소식 등록 오류:",
                    error
                );

                alert(
                    "소식을 등록하지 못했습니다.\n\n"
                    + error.message
                );

                return;

            }


            document
                .getElementById("input-author")
                .value = "";

            document
                .getElementById("input-title")
                .value = "";

            document
                .getElementById("input-content")
                .value = "";


            alert(
                "소식이 등록되었습니다."
            );


            await openNewsList();

        }


        /* ==================================================
           소식 삭제
        ================================================== */

        async function deleteCurrentNews() {

            if (!currentNewsId) {

                return;

            }


            const confirmed =
                window.confirm(
                    "정말 이 소식을 삭제하시겠습니까?"
                );


            if (!confirmed) {

                return;

            }


            const button =
                document.getElementById(
                    "delete-news"
                );


            button.disabled = true;

            button.textContent =
                "삭제 중...";


            const {
                error
            } = await supabaseClient
                .from("news")
                .delete()
                .eq(
                    "id",
                    currentNewsId
                );


            button.disabled = false;

            button.textContent =
                "소식 삭제";


            if (error) {

                console.error(
                    "소식 삭제 오류:",
                    error
                );

                alert(
                    "소식을 삭제하지 못했습니다.\n\n"
                    + error.message
                );

                return;

            }


            currentNewsId = null;


            alert(
                "소식이 삭제되었습니다."
            );


            await openNewsList();

        }


        /* ==================================================
           안전한 HTML 표시
        ================================================== */

        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==================================================
           스크롤 맨 위
        ================================================== */

        function scrollTop() {

            const main =
                document.querySelector(
                    ".main-content"
                );


            if (main) {

                main.scrollTop = 0;

            }

        }


        /* ==================================================
           버튼 연결
        ================================================== */

        document
            .getElementById("show-news-list")
            .addEventListener(
                "click",
                openNewsList
            );


        document
            .getElementById("show-write")
            .addEventListener(
                "click",
                openWriteScreen
            );


        document
            .getElementById("back-to-list")
            .addEventListener(
                "click",
                openNewsList
            );


        document
            .getElementById("back-from-write")
            .addEventListener(
                "click",
                openNewsList
            );


        document
            .getElementById("cancel-write")
            .addEventListener(
                "click",
                openNewsList
            );


        document
            .getElementById("save-write")
            .addEventListener(
                "click",
                saveNews
            );


        document
            .getElementById("delete-news")
            .addEventListener(
                "click",
                deleteCurrentNews
            );


        document
            .getElementById("menu-news")
            .addEventListener(
                "click",
                openNewsIntro
            );


        document
            .getElementById("menu-donation")
            .addEventListener(
                "click",
                openDonation
            );


        /* ==================================================
           시작
        ================================================== */

        openNewsIntro();

    </script>

</body>
</html>
