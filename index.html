<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="./style.css?v=30">
</head>

<body>

    <!-- ==================================================
         상단 헤더
    ================================================== -->

    <header class="top-bar">

        <div class="profile">
            <img src="./profile.png" alt="까치치킨사장님">
        </div>

        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

        <!-- 관리자 버튼 -->
        <button
            id="adminButton"
            class="admin-button"
            type="button"
        >
            관리자
        </button>

    </header>

    <div class="header-line"></div>


    <!-- ==================================================
         전체 사이트
    ================================================== -->

    <div class="site-layout">


        <!-- ==================================================
             왼쪽 사이드바
        ================================================== -->

        <aside class="sidebar">

            <button
                id="menu-news"
                class="menu-item active"
                type="button"
            >
                소식
            </button>

            <button
                id="menu-donation"
                class="menu-item"
                type="button"
            >
                기부
            </button>

            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                고급소식 🔒
            </button>

            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                영상미리보기 🔒
            </button>

            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                (추가예정)
            </button>

        </aside>


        <!-- ==================================================
             오른쪽 메인
        ================================================== -->

        <main class="main-content">


            <!-- ==================================================
                 1. 소식 소개
            ================================================== -->

            <section
                id="screen-news-intro"
                class="screen visible"
            >

                <h1 class="page-heading">
                    소식
                </h1>

                <div class="intro-box">

                    <h2>
                        까치치킨사장님 공식 소식
                    </h2>

                    <p>
                        새로운 소식과 공지사항이 이곳에 표시됩니다.
                    </p>

                    <button
                        id="show-news-list"
                        class="orange-button"
                        type="button"
                    >
                        소식 자세히 보러가기
                    </button>

                </div>

            </section>


            <!-- ==================================================
                 2. 소식 목록
            ================================================== -->

            <section
                id="screen-news-list"
                class="screen"
            >

                <div class="list-header">

                    <div>
                        <h1 class="page-heading">
                            소식
                        </h1>

                        <p class="page-subtitle">
                            까치치킨사장님의 소식과 공지사항입니다.
                        </p>
                    </div>

                    <!-- 관리자만 표시 -->
                    <button
                        id="show-write"
                        class="orange-small-button hidden"
                        type="button"
                    >
                        + 소식 작성
                    </button>

                </div>

                <div id="news-list-container"></div>

            </section>


            <!-- ==================================================
                 3. 소식 상세
            ================================================== -->

            <section
                id="screen-news-detail"
                class="screen"
            >

                <button
                    id="back-to-list"
                    class="white-button"
                    type="button"
                >
                    ← 소식 목록
                </button>

                <article
                    id="news-detail-container"
                    class="detail-box"
                ></article>

                <!-- 관리자만 표시 -->
                <button
                    id="delete-news"
                    class="delete-button hidden"
                    type="button"
                >
                    소식 삭제
                </button>

            </section>


            <!-- ==================================================
                 4. 소식 작성
            ================================================== -->

            <section
                id="screen-write"
                class="screen"
            >

                <button
                    id="back-from-write"
                    class="white-button"
                    type="button"
                >
                    ← 소식 목록
                </button>

                <div class="write-box">

                    <h1>
                        소식 작성
                    </h1>

                    <label for="input-title">
                        제목
                    </label>

                    <input
                        id="input-title"
                        type="text"
                        placeholder="소식 제목"
                        autocomplete="off"
                    >

                    <label for="input-content">
                        내용
                    </label>

                    <textarea
                        id="input-content"
                        placeholder="소식 내용을 입력하세요."
                    ></textarea>

                    <div class="write-actions">

                        <button
                            id="cancel-write"
                            class="white-button"
                            type="button"
                        >
                            취소
                        </button>

                        <button
                            id="save-write"
                            class="orange-small-button"
                            type="button"
                        >
                            소식 등록
                        </button>

                    </div>

                </div>

            </section>


            <!-- ==================================================
                 5. 관리자 로그인
            ================================================== -->

            <section
                id="screen-admin-login"
                class="screen"
            >

                <div class="login-box">

                    <h1>
                        관리자 로그인
                    </h1>

                    <p class="login-description">
                        관리자만 로그인할 수 있습니다.
                    </p>

                    <label for="admin-username">
                        아이디
                    </label>

                    <input
                        id="admin-username"
                        type="text"
                        placeholder="관리자 아이디"
                        autocomplete="username"
                    >

                    <label for="admin-password">
                        비밀번호
                    </label>

                    <input
                        id="admin-password"
                        type="password"
                        placeholder="관리자 비밀번호"
                        autocomplete="current-password"
                    >

                    <button
                        id="admin-login-submit"
                        class="login-button"
                        type="button"
                    >
                        관리자 로그인
                    </button>

                    <button
                        id="cancel-login"
                        class="login-cancel-button"
                        type="button"
                    >
                        취소
                    </button>

                    <p
                        id="login-error"
                        class="login-error"
                    ></p>

                </div>

            </section>


            <!-- ==================================================
                 6. 기부
            ================================================== -->

            <section
                id="screen-donation"
                class="screen"
            >

                <h1 class="page-heading">
                    기부
                </h1>

            </section>

        </main>

    </div>


    <!-- ==================================================
         Supabase
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* ==================================================
           Supabase 설정
        ================================================== */

        const SUPABASE_URL =
            "https://kxrjevmxayolcqcgmixz.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_KrmPM2G4nuS1JXOAvnp-cA_Ik1nuYqS";

        /*
         * Authentication → Users에서 만든
         * 관리자 계정의 실제 이메일을 여기에 넣어.
         *
         * 비밀번호는 절대 코드에 넣지 않는다.
         */
        const ADMIN_AUTH_EMAIL =
            "qwertjbhbuhbbjt@gmail.com";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==================================================
           상태
        ================================================== */

        let isAdmin = false;
        let currentNewsId = null;


        /* ==================================================
           화면
        ================================================== */

        const introScreen =
            document.getElementById("screen-news-intro");

        const listScreen =
            document.getElementById("screen-news-list");

        const detailScreen =
            document.getElementById("screen-news-detail");

        const writeScreen =
            document.getElementById("screen-write");

        const loginScreen =
            document.getElementById("screen-admin-login");

        const donationScreen =
            document.getElementById("screen-donation");


        /* ==================================================
           메뉴
        ================================================== */

        const newsMenu =
            document.getElementById("menu-news");

        const donationMenu =
            document.getElementById("menu-donation");


        /* ==================================================
           관리자 UI
        ================================================== */

        const adminButton =
            document.getElementById("adminButton");

        const showWriteButton =
            document.getElementById("show-write");

        const deleteNewsButton =
            document.getElementById("delete-news");


        /* ==================================================
           화면 숨기기
        ================================================== */

        function hideAllScreens() {

            introScreen.classList.remove("visible");
            listScreen.classList.remove("visible");
            detailScreen.classList.remove("visible");
            writeScreen.classList.remove("visible");
            loginScreen.classList.remove("visible");
            donationScreen.classList.remove("visible");

        }


        /* ==================================================
           메뉴 활성화
        ================================================== */

        function activateNewsMenu() {

            newsMenu.classList.add("active");
            donationMenu.classList.remove("active");

        }


        function activateDonationMenu() {

            donationMenu.classList.add("active");
            newsMenu.classList.remove("active");

        }


        /* ==================================================
           관리자 UI 상태
        ================================================== */

        function updateAdminUI() {

            if (isAdmin) {

                adminButton.textContent =
                    "관리자 로그아웃";

                adminButton.classList.add(
                    "logged-in"
                );

                showWriteButton.classList.remove(
                    "hidden"
                );

                if (currentNewsId !== null) {

                    deleteNewsButton.classList.remove(
                        "hidden"
                    );

                }

            } else {

                adminButton.textContent =
                    "관리자";

                adminButton.classList.remove(
                    "logged-in"
                );

                showWriteButton.classList.add(
                    "hidden"
                );

                deleteNewsButton.classList.add(
                    "hidden"
                );

            }

        }


        /* ==================================================
           소식 소개
        ================================================== */

        function openNewsIntro() {

            hideAllScreens();

            introScreen.classList.add(
                "visible"
            );

            activateNewsMenu();

            currentNewsId = null;

            updateAdminUI();

            scrollTop();

        }


        /* ==================================================
           소식 목록
        ================================================== */

        async function openNewsList() {

            hideAllScreens();

            listScreen.classList.add(
                "visible"
            );

            activateNewsMenu();

            currentNewsId = null;

            updateAdminUI();

            scrollTop();

            await renderNews();

        }


        /* ==================================================
           관리자 로그인 화면
        ================================================== */

        function openAdminLogin() {

            if (isAdmin) {

                logoutAdmin();

                return;

            }

            hideAllScreens();

            loginScreen.classList.add(
                "visible"
            );

            activateNewsMenu();

            document.getElementById(
                "admin-username"
            ).value = "";

            document.getElementById(
                "admin-password"
            ).value = "";

            document.getElementById(
                "login-error"
            ).textContent = "";

            scrollTop();

        }


        /* ==================================================
           관리자 로그인
        ================================================== */

        async function loginAdmin() {

            const username =
                document.getElementById(
                    "admin-username"
                ).value.trim();

            const password =
                document.getElementById(
                    "admin-password"
                ).value;

            const errorBox =
                document.getElementById(
                    "login-error"
                );

            errorBox.textContent = "";


            if (!username) {

                errorBox.textContent =
                    "아이디를 입력해주세요.";

                return;

            }


            if (!password) {

                errorBox.textContent =
                    "비밀번호를 입력해주세요.";

                return;

            }


            /*
             * 사이트에 표시할 아이디가
             * profiles.username과 일치하는지 확인.
             *
             * 현재 프로필 RLS가 자기 자신만 읽게 되어 있으므로
             * 여기서는 관리자 UUID를 이미 알고 있다고 가정하는 대신,
             * Auth 로그인 후 profile을 확인한다.
             */


            const {
                error: authError
            } = await supabaseClient.auth
                .signInWithPassword({

                    email:
                        ADMIN_AUTH_EMAIL,

                    password:
                        password

                });


            if (authError) {

                console.error(
                    authError
                );

                errorBox.textContent =
                    "아이디 또는 비밀번호가 올바르지 않습니다.";

                return;

            }


            /*
             * 로그인한 사용자 확인
             */

            const {
                data: authData,
                error: userError
            } = await supabaseClient.auth.getUser();


            if (
                userError
                || !authData
                || !authData.user
            ) {

                await supabaseClient.auth.signOut();

                errorBox.textContent =
                    "관리자 인증에 실패했습니다.";

                return;

            }


            /*
             * 로그인한 UUID로 profiles 조회
             */

            const {
                data: profile,
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .select(
                    "id, username, can_manage_news"
                )
                .eq(
                    "id",
                    authData.user.id
                )
                .maybeSingle();


            if (
                profileError
                || !profile
                || !profile.can_manage_news
                || profile.username !== username
            ) {

                await supabaseClient.auth.signOut();

                errorBox.textContent =
                    "관리자 권한이 없습니다.";

                return;

            }


            isAdmin = true;

            updateAdminUI();

            await openNewsList();

        }


        /* ==================================================
           로그아웃
        ================================================== */

        async function logoutAdmin() {

            await supabaseClient.auth.signOut();

            isAdmin = false;
            currentNewsId = null;

            updateAdminUI();

            openNewsIntro();

        }


        /* ==================================================
           세션 복구
        ================================================== */

        async function checkAdminSession() {

            const {
                data
            } = await supabaseClient.auth.getSession();


            if (!data.session) {

                isAdmin = false;

                updateAdminUI();

                return;

            }


            const {
                data: authData
            } = await supabaseClient.auth.getUser();


            if (
                !authData
                || !authData.user
            ) {

                isAdmin = false;

                updateAdminUI();

                return;

            }


            const {
                data: profile
            } = await supabaseClient
                .from("profiles")
                .select(
                    "id, username, can_manage_news"
                )
                .eq(
                    "id",
                    authData.user.id
                )
                .maybeSingle();


            if (
                !profile
                || !profile.can_manage_news
            ) {

                await supabaseClient.auth.signOut();

                isAdmin = false;

                updateAdminUI();

                return;

            }


            isAdmin = true;

            updateAdminUI();

        }


        /* ==================================================
           작성 화면
        ================================================== */

        function openWriteScreen() {

            if (!isAdmin) {

                openAdminLogin();

                return;

            }

            hideAllScreens();

            writeScreen.classList.add(
                "visible"
            );

            activateNewsMenu();

            scrollTop();

        }


        /* ==================================================
           기부
        ================================================== */

        function openDonation() {

            hideAllScreens();

            donationScreen.classList.add(
                "visible"
            );

            activateDonationMenu();

            scrollTop();

        }


        /* ==================================================
           뉴스 읽기
        ================================================== */

        async function getNews() {

            const {
                data,
                error
            } = await supabaseClient
                .from("news")
                .select(
                    "id, author, title, content, created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    error
                );

                alert(
                    "소식을 불러오지 못했습니다."
                );

                return [];

            }


            return data || [];

        }


        /* ==================================================
           날짜
        ================================================== */

        function formatDate(value) {

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }

            return (
                date.getFullYear()
                + "."
                + String(
                    date.getMonth() + 1
                ).padStart(2, "0")
                + "."
                + String(
                    date.getDate()
                ).padStart(2, "0")
            );

        }


        /* ==================================================
           소식 목록
        ================================================== */

        async function renderNews() {

            const container =
                document.getElementById(
                    "news-list-container"
                );


            container.innerHTML = `
                <div class="empty-box">
                    <div class="empty-title">
                        불러오는 중...
                    </div>
                </div>
            `;


            const newsList =
                await getNews();


            if (newsList.length === 0) {

                container.innerHTML = `
                    <div class="empty-box">

                        <div class="empty-title">
                            소식 없음
                        </div>

                        <div class="empty-description">
                            현재 등록된 소식이 없습니다.
                        </div>

                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            const list =
                document.createElement(
                    "div"
                );


            list.className =
                "news-list";


            newsList.forEach(function(news) {

                const row =
                    document.createElement(
                        "button"
                    );


                row.type = "button";

                row.className =
                    "news-row";


                row.innerHTML = `
                    <span class="news-author">
                        (${escapeHTML(news.author)})
                    </span>

                    <span class="news-title">
                        ${escapeHTML(news.title)}
                    </span>

                    <span class="news-date">
                        ${formatDate(
                            news.created_at
                        )}
                    </span>
                `;


                row.addEventListener(
                    "click",
                    function() {

                        openNewsDetail(
                            news.id
                        );

                    }
                );


                list.appendChild(row);

            });


            container.appendChild(list);

        }


        /* ==================================================
           상세보기
        ================================================== */

        async function openNewsDetail(newsId) {

            const {
                data: news,
                error
            } = await supabaseClient
                .from("news")
                .select(
                    "id, author, title, content, created_at"
                )
                .eq(
                    "id",
                    newsId
                )
                .single();


            if (error) {

                alert(
                    "소식을 불러오지 못했습니다."
                );

                return;

            }


            currentNewsId =
                news.id;


            hideAllScreens();

            detailScreen.classList.add(
                "visible"
            );

            activateNewsMenu();


            document.getElementById(
                "news-detail-container"
            ).innerHTML = `
                <div class="detail-author">
                    (${escapeHTML(news.author)})
                </div>

                <div class="detail-title-line">

                    <h1 class="detail-title">
                        ${escapeHTML(news.title)}
                    </h1>

                    <span class="detail-date">
                        ${formatDate(
                            news.created_at
                        )}
                    </span>

                </div>

                <div class="detail-content">
                    ${escapeHTML(
                        news.content
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}
                </div>
            `;


            updateAdminUI();

            scrollTop();

        }


        /* ==================================================
           소식 등록
        ================================================== */

        async function saveNews() {

            if (!isAdmin) {

                alert(
                    "관리자만 소식을 작성할 수 있습니다."
                );

                return;

            }


            const title =
                document.getElementById(
                    "input-title"
                ).value.trim();

            const content =
                document.getElementById(
                    "input-content"
                ).value.trim();


            if (!title) {

                alert(
                    "제목을 입력해주세요."
                );

                return;

            }


            if (!content) {

                alert(
                    "내용을 입력해주세요."
                );

                return;

            }


            const {
                data: authData
            } = await supabaseClient.auth.getUser();


            if (
                !authData
                || !authData.user
            ) {

                isAdmin = false;

                updateAdminUI();

                alert(
                    "로그인이 필요합니다."
                );

                return;

            }


            const {
                data: profile,
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .select(
                    "username, can_manage_news"
                )
                .eq(
                    "id",
                    authData.user.id
                )
                .maybeSingle();


            if (
                profileError
                || !profile
                || !profile.can_manage_news
            ) {

                alert(
                    "관리자 권한이 없습니다."
                );

                return;

            }


            const {
                error
            } = await supabaseClient
                .from("news")
                .insert({
                    author:
                        profile.username,

                    title:
                        title,

                    content:
                        content
                });


            if (error) {

                console.error(
                    error
                );

                alert(
                    "소식을 등록하지 못했습니다.\n"
                    + error.message
                );

                return;

            }


            document.getElementById(
                "input-title"
            ).value = "";

            document.getElementById(
                "input-content"
            ).value = "";


            await openNewsList();

        }


        /* ==================================================
           소식 삭제
        ================================================== */

        async function deleteCurrentNews() {

            if (!isAdmin) {

                alert(
                    "관리자만 삭제할 수 있습니다."
                );

                return;

            }


            if (!currentNewsId) {

                return;

            }


            const confirmed =
                window.confirm(
                    "정말 이 소식을 삭제하시겠습니까?"
                );


            if (!confirmed) {

                return;

            }


            const {
                error
            } = await supabaseClient
                .from("news")
                .delete()
                .eq(
                    "id",
                    currentNewsId
                );


            if (error) {

                console.error(
                    error
                );

                alert(
                    "삭제하지 못했습니다.\n"
                    + error.message
                );

                return;

            }


            currentNewsId = null;

            await openNewsList();

        }


        /* ==================================================
           HTML 안전 처리
        ================================================== */

        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }
