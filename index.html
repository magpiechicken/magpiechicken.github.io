<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         상단 헤더
    ========================================== -->
    <header class="top-bar">

        <!-- 프로필 사진 -->
        <div class="profile">
            <img src="profile.png" alt="까치치킨사장님">
        </div>

        <!-- 홈페이지 제목 -->
        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

    </header>


    <!-- =========================================
         상단 헤더 아래 검은색 경계선
    ========================================== -->
    <div class="header-line"></div>


    <!-- =========================================
         본문 전체
    ========================================== -->
    <div class="site-layout">


        <!-- =====================================
             왼쪽 사이드바
        ====================================== -->
        <aside class="sidebar">


            <!-- 소식 -->
            <button class="menu-item active" type="button">
                <span class="menu-text">소식</span>
            </button>


            <!-- 기부 -->
            <button class="menu-item" type="button">
                <span class="menu-text">기부</span>
            </button>


            <!-- 고급소식 -->
            <button class="menu-item locked" type="button">
                <span class="menu-text">고급소식</span>
                <span class="lock-icon">🔒</span>
            </button>


            <!-- 영상미리보기 -->
            <button class="menu-item locked" type="button">
                <span class="menu-text">영상미리보기</span>
                <span class="lock-icon">🔒</span>
            </button>


            <!-- 추가 예정 -->
            <button class="menu-item upcoming" type="button">
                <span class="menu-text">(추가예정)</span>
            </button>


            <!-- 추가 예정 -->
            <button class="menu-item upcoming" type="button">
                <span class="menu-text">(추가예정)</span>
            </button>


        </aside>


        <!-- =====================================
             오른쪽 메인 화면
        ====================================== -->
        <main class="main-content">


            <!-- 소식 박스 -->
            <section class="content-box">
                <h2>까사장 소식</h2>

                <p>
                    새로운 소식이 이곳에 표시됩니다.
                </p>
            </section>


            <!-- 추천 영상 박스 -->
            <section class="content-box">
                <h2>까사장 추천영상</h2>

                <p>
                    추천 영상이 이곳에 표시됩니다.
                </p>
            </section>


        </main>

    </div>

</body>
</html>
