<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- ==================================================
         상단 헤더
    ================================================== -->

    <header class="top-bar">

        <div class="profile">
            <img src="profile.png" alt="까치치킨사장님">
        </div>

        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

    </header>


    <!-- 상단 검은색 경계선 -->
    <div class="header-line"></div>


    <!-- ==================================================
         사이트 전체
    ================================================== -->

    <div class="site-layout">


        <!-- ==================================================
             왼쪽 사이드바
        ================================================== -->

        <aside class="sidebar">

            <!-- 소식 -->
            <button
                id="newsMenu"
                class="menu-item active"
                type="button"
                onclick="showNewsHome()"
            >
                <span>소식</span>
            </button>


            <!-- 기부 -->
            <button
                id="donationMenu"
                class="menu-item"
                type="button"
                onclick="showDonation()"
            >
                <span>기부</span>
            </button>


            <!-- 고급소식 잠금 -->
            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                <span>고급소식</span>
                <span class="lock">🔒</span>
            </button>


            <!-- 영상미리보기 잠금 -->
            <button
                class="menu-item locked"
                type="button"
                disabled
            >
                <span>영상미리보기</span>
                <span class="lock">🔒</span>
            </button>


            <!-- 추가 예정 -->
            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                <span>(추가예정)</span>
            </button>


            <!-- 추가 예정 -->
            <button
                class="menu-item upcoming"
                type="button"
                disabled
            >
                <span>(추가예정)</span>
            </button>

        </aside>


        <!-- ==================================================
             오른쪽 메인 영역
        ================================================== -->

        <main class="main-content">


            <!-- ==================================================
                 소식 메인 화면
            ================================================== -->

            <section id="newsHome" class="page active-page">

                <h1 class="page-heading">
                    소식
                </h1>


                <div class="news-box">

                    <h2>
                        까치치킨사장님 공식 소식
                    </h2>


                    <p>
                        새로운 소식과 공지사항이 이곳에 표시됩니다.
                    </p>


                    <!-- 소식 자세히 보러가기 -->
                    <button
                        class="detail-button"
                        type="button"
                        onclick="showNewsDetail()"
                    >
                        소식 자세히 보러가기
                    </button>

                </div>

            </section>


            <!-- ==================================================
                 소식 전용 화면
            ================================================== -->

            <section id="newsDetail" class="page">

                <!-- 돌아가기 -->
                <button
                    class="back-button"
                    type="button"
                    onclick="showNewsHome()"
                >
                    ← 소식으로 돌아가기
                </button>


                <div class="detail-page">

                    <!-- 작성자 -->
                    <div class="detail-author">
                        (까치치킨사장님)
                    </div>


                    <!-- 제목 + 날짜 -->
                    <div class="detail-title-row">

                        <h1 class="detail-title">
                            새로운 소식이 올라왔습니다
                        </h1>

                        <span class="detail-date">
                            2026.08.23
                        </span>

                    </div>


                    <!-- 내용 -->
                    <p class="detail-content">
                        새로운 소식의 내용이 이곳에 표시됩니다.
                    </p>

                </div>

            </section>


            <!-- ==================================================
                 기부 화면
            ================================================== -->

            <section id="donationPage" class="page">

                <h1 class="page-heading">
                    기부
                </h1>

            </section>


        </main>

    </div>


    <!-- ==================================================
         JavaScript
    ================================================== -->

    <script>

        /* ------------------------------------------
           화면 요소 가져오기
        ------------------------------------------ */

        const newsHome = document.getElementById("newsHome");
        const newsDetail = document.getElementById("newsDetail");
        const donationPage = document.getElementById("donationPage");

        const newsMenu = document.getElementById("newsMenu");
        const donationMenu = document.getElementById("donationMenu");


        /* ------------------------------------------
           모든 화면 숨기기
        ------------------------------------------ */

        function hideAllPages() {

            newsHome.classList.remove("active-page");
            newsDetail.classList.remove("active-page");
            donationPage.classList.remove("active-page");

        }


        /* ------------------------------------------
           소식 메인 화면
        ------------------------------------------ */

        function showNewsHome() {

            hideAllPages();

            newsHome.classList.add("active-page");

            newsMenu.classList.add("active");
            donationMenu.classList.remove("active");

        }


        /* ------------------------------------------
           소식 전용 화면
        ------------------------------------------ */

        function showNewsDetail() {

            hideAllPages();

            newsDetail.classList.add("active-page");

            newsMenu.classList.add("active");
            donationMenu.classList.remove("active");

        }


        /* ------------------------------------------
           기부 화면
        ------------------------------------------ */

        function showDonation() {

            hideAllPages();

            donationPage.classList.add("active-page");

            donationMenu.classList.add("active");
            newsMenu.classList.remove("active");

        }


        /* ------------------------------------------
           처음 페이지를 열었을 때
        ------------------------------------------ */

        showNewsHome();

    </script>

</body>
</html>
