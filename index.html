<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>까치치킨사장님 공식 홈페이지</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         상단 헤더
    ========================== -->
    <header class="top-bar">

        <div class="profile">
            <img src="profile.png" alt="까치치킨사장님">
        </div>

        <div class="title">
            까치치킨사장님 공식 홈페이지
        </div>

    </header>


    <!-- 상단 검은색 선 -->
    <div class="header-line"></div>


    <!-- =========================
         전체 레이아웃
    ========================== -->
    <div class="site-layout">

        <!-- =====================
             왼쪽 사이드바
        ====================== -->
        <aside class="sidebar">

            <button class="menu-item active" id="newsMenu" type="button">
                <span>소식</span>
            </button>

            <button class="menu-item" id="donationMenu" type="button">
                <span>기부</span>
            </button>

            <button class="menu-item locked" type="button" disabled>
                <span>고급소식</span>
                <span>🔒</span>
            </button>

            <button class="menu-item locked" type="button" disabled>
                <span>영상미리보기</span>
                <span>🔒</span>
            </button>

            <button class="menu-item upcoming" type="button" disabled>
                <span>(추가예정)</span>
            </button>

            <button class="menu-item upcoming" type="button" disabled>
                <span>(추가예정)</span>
            </button>

        </aside>


        <!-- =====================
             오른쪽 메인 영역
        ====================== -->
        <main class="main-content">

            <!-- =================
                 기본 소식 화면
            ================== -->
            <section id="newsHome" class="page active-page">

                <h1 class="page-heading">
                    소식
                </h1>

                <div class="news-box">

                    <h2>
                        까치치킨사장님 공식 소식
                    </h2>

                    <p>
                        새로운 소식과 공지사항이 이곳에 표시됩니다.
                    </p>

                    <button
                        id="newsDetailButton"
                        class="detail-button"
                        type="button"
                    >
                        소식 자세히 보러가기
                    </button>

                </div>

            </section>


            <!-- =================
                 소식 전용 화면
            ================== -->
            <section id="newsDetail" class="page">

                <button
                    id="backToNewsButton"
                    class="back-button"
                    type="button"
                >
                    ← 소식으로 돌아가기
                </button>

                <div class="detail-page">

                    <h1>
                        소식 전용 화면
                    </h1>

                    <p>
                        이곳에 앞으로 실제 소식들이 표시됩니다.
                    </p>

                </div>

            </section>


            <!-- =================
                 기부 화면
            ================== -->
            <section id="donationPage" class="page">

                <h1 class="page-heading">
                    기부
                </h1>

            </section>

        </main>

    </div>


    <script src="./script.js"></script>

</body>
</html>
