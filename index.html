<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>까치치킨사장님 공식 홈페이지</title>
    <link rel="stylesheet" href="./style.css?v=62">
</head>

<body>

<header class="top-bar">

    <div class="profile">
        <img
            src="./profile.png"
            alt="까치치킨사장님"
        >
    </div>

    <div class="title">
        까치치킨사장님 공식 홈페이지
    </div>

    <div class="header-actions">

        <button
            id="loginInfoButton"
            class="info-button"
            type="button"
        >
            로그인 정보
        </button>

        <button
            id="accountButton"
            class="admin-button"
            type="button"
        >
            로그인
        </button>

    </div>

</header>

<div class="header-line"></div>

<div class="site-layout">

    <aside class="sidebar">

        <button
            id="menu-news"
            class="menu-item active"
            type="button"
        >
            소식
        </button>

        <button
            id="menu-donation"
            class="menu-item"
            type="button"
        >
            후원
        </button>

        <button
            class="menu-item locked"
            type="button"
            disabled
        >
            고급소식 🔒
        </button>

        <button
            class="menu-item locked"
            type="button"
            disabled
        >
            영상미리보기 🔒
        </button>

        <button
            class="menu-item upcoming"
            type="button"
            disabled
        >
            (추가예정)
        </button>

        <button
            class="menu-item upcoming"
            type="button"
            disabled
        >
            (추가예정)
        </button>

    </aside>


    <main class="main-content">

        <section
            id="screen-news-intro"
            class="screen visible"
        >

            <h1 class="page-heading">
                소식
            </h1>

            <div class="intro-box">

                <h2>
                    까치치킨사장님 공식 소식
                </h2>

                <p>
                    새로운 소식과 공지사항이 이곳에 표시됩니다.
                </p>

                <button
                    id="show-news-list"
                    class="orange-button"
                    type="button"
                >
                    소식 자세히 보러가기
                </button>

            </div>

        </section>


        <section
            id="screen-news-list"
            class="screen"
        >

            <div class="list-header">

                <div>

                    <h1 class="page-heading">
                        소식
                    </h1>

                    <p class="page-subtitle">
                        까치치킨사장님의 소식과 공지사항입니다.
                    </p>

                </div>

                <button
                    id="show-write"
                    class="orange-small-button hidden"
                    type="button"
                >
                    + 소식 작성
                </button>

            </div>

            <div
                id="news-list-container"
            ></div>

        </section>


        <section
            id="screen-news-detail"
            class="screen"
        >

            <button
                id="back-to-list"
                class="white-button"
                type="button"
            >
                ← 소식 목록
            </button>

            <article
                id="news-detail-container"
                class="detail-box"
            ></article>

            <div
                id="news-detail-images"
                class="news-images hidden"
            ></div>


            <!-- 좋아요 / 댓글 -->

            <section
                id="news-interactions"
                class="news-interactions"
            >

                <div class="reaction-bar">

                    <button
                        id="like-button"
                        class="like-button"
                        type="button"
                    >
                        ♡ 좋아요
                        <span id="like-count">
                            0
                        </span>
                    </button>

                    <span
                        id="comment-count"
                        class="comment-count"
                    >
                        댓글 0개
                    </span>

                </div>


                <div
                    id="comments-container"
                    class="comments-container"
                ></div>


                <div
                    id="comment-login-notice"
                    class="comment-login-notice hidden"
                >
                    로그인하면 좋아요와 댓글을 사용할 수 있습니다.
                </div>


                <div
                    id="comment-form"
                    class="comment-form hidden"
                >

                    <textarea
                        id="comment-input"
                        placeholder="댓글을 입력하세요."
                        maxlength="500"
                    ></textarea>

                    <div class="comment-form-bottom">

                        <span
                            id="comment-length"
                            class="comment-length"
                        >
                            0 / 500
                        </span>

                        <button
                            id="comment-submit"
                            class="orange-small-button"
                            type="button"
                        >
                            댓글 등록
                        </button>

                    </div>

                </div>

            </section>


            <button
                id="delete-news"
                class="delete-button hidden"
                type="button"
            >
                소식 삭제
            </button>

        </section>


        <section
            id="screen-write"
            class="screen"
        >

            <button
                id="back-from-write"
                class="white-button"
                type="button"
            >
                ← 소식 목록
            </button>

            <div class="write-box">

                <h1>
                    소식 작성
                </h1>

                <label for="input-title">
                    제목
                </label>

                <input
                    id="input-title"
                    type="text"
                    placeholder="소식 제목"
                    autocomplete="off"
                >

                <label for="input-content">
                    내용
                </label>

                <textarea
                    id="input-content"
                    placeholder="소식 내용을 입력하세요."
                ></textarea>

                <label for="input-images">
                    사진 첨부
                </label>

                <input
                    id="input-images"
                    class="file-input"
                    type="file"
                    accept="image/*"
                    multiple
                >

                <p
                    id="image-help"
                    class="image-help"
                >
                    사진을 선택하면 아래에 미리보기가 표시됩니다.
                    최대 5장 · 사진 1장당 최대 5MB
                </p>

                <div
                    id="image-preview"
                    class="image-preview"
                ></div>

                <div class="write-actions">

                    <button
                        id="cancel-write"
                        class="white-button"
                        type="button"
                    >
                        취소
                    </button>

                    <button
                        id="save-write"
                        class="orange-small-button"
                        type="button"
                    >
                        소식 등록
                    </button>

                </div>

            </div>

        </section>


        <section
            id="screen-auth"
            class="screen"
        >

            <div class="auth-box">

                <div class="auth-tabs">

                    <button
                        id="login-tab"
                        class="auth-tab active"
                        type="button"
                    >
                        로그인
                    </button>

                    <button
                        id="signup-tab"
                        class="auth-tab"
                        type="button"
                    >
                        회원가입
                    </button>

                </div>


                <div
                    id="auth-login-panel"
                    class="auth-panel"
                >

                    <h1>
                        로그인
                    </h1>

                    <p class="auth-description">
                        가입한 계정으로 로그인하세요.
                    </p>

                    <label for="login-email">
                        이메일
                    </label>

                    <input
                        id="login-email"
                        type="email"
                        placeholder="이메일"
                        autocomplete="email"
                    >

                    <label for="login-password">
                        비밀번호
                    </label>

                    <input
                        id="login-password"
                        type="password"
                        placeholder="비밀번호"
                        autocomplete="current-password"
                    >

                    <button
                        id="login-submit"
                        class="login-button"
                        type="button"
                    >
                        로그인
                    </button>

                </div>


                <div
                    id="auth-signup-panel"
                    class="auth-panel hidden"
                >

                    <h1>
                        회원가입
                    </h1>

                    <p class="auth-description">
                        계정을 만들어주세요.
                    </p>

                    <label for="signup-username">
                        아이디
                    </label>

                    <input
                        id="signup-username"
                        type="text"
                        placeholder="사용할 아이디"
                        autocomplete="username"
                        maxlength="30"
                    >

                    <label for="signup-email">
                        이메일
                    </label>

                    <input
                        id="signup-email"
                        type="email"
                        placeholder="이메일"
                        autocomplete="email"
                    >

                    <label for="signup-password">
                        비밀번호
                    </label>

                    <input
                        id="signup-password"
                        type="password"
                        placeholder="비밀번호"
                        autocomplete="new-password"
                    >

                    <label for="signup-password-confirm">
                        비밀번호 확인
                    </label>

                    <input
                        id="signup-password-confirm"
                        type="password"
                        placeholder="비밀번호 다시 입력"
                        autocomplete="new-password"
                    >

                    <button
                        id="signup-submit"
                        class="login-button"
                        type="button"
                    >
                        회원가입
                    </button>

                </div>

                <p
                    id="auth-message"
                    class="login-error"
                ></p>

                <button
                    id="auth-cancel"
                    class="login-cancel-button"
                    type="button"
                >
                    취소
                </button>

            </div>

        </section>


        <section
            id="screen-donation"
            class="screen"
        >

            <h1 class="page-heading">
                후원
            </h1>

        </section>

    </main>

</div>


<div
    id="loginInfoModal"
    class="login-info-modal hidden"
>

    <div class="login-info-box">

        <button
            id="closeLoginInfo"
            class="login-info-close"
            type="button"
            aria-label="닫기"
        >
            ×
        </button>

        <h2>
            로그인 정보
        </h2>

        <div
            id="loginInfoContent"
            class="login-info-content"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./script.js?v=62"></script>

</body>
</html>
