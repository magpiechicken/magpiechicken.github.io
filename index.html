<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>까치치킨사장님 공식 홈페이지 - 홈</title>
    <link rel="stylesheet" href="./style.css?v=77">
    <style>
        .home-page {
            min-height: 100vh;
            background: #fff;
        }

        .home-page-main {
            min-height: calc(100vh - 11.111111vh - 3px - 48px);
            padding: 45px;
            overflow: auto;
        }

        .home-window {
            width: 100%;
            background: #fff;
            border: 4px solid #000;
        }

        .home-window-title {
            padding: 24px 30px;
            border-bottom: 3px solid #000;
            font-size: 34px;
            font-weight: 700;
            text-align: center;
        }

        .home-window-body {
            padding: 55px 45px;
        }

        .home-window-body h1 {
            margin: 0 0 18px;
            font-size: 42px;
        }

        .home-window-body p {
            margin: 0 0 28px;
            font-size: 21px;
            line-height: 1.7;
        }

        .youtube-link {
            display: inline-block;
            padding: 14px 24px;
            background: #FF0000;
            color: #ffffff;
            border: 3px solid #000000;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
        }

        .youtube-link:hover {
            background: #cc0000;
        }

        .home-page .sidebar {
            top: calc(11.111111vh + 3px + 48px) !important;
        }

        @media (max-width: 700px) {
            .home-page-main {
                min-height: calc(100vh - 74px - 42px);
                padding: 14px 10px;
            }

            .home-window {
                border-width: 2px;
            }

            .home-window-title {
                padding: 14px 16px;
                border-bottom-width: 2px;
                font-size: 24px;
            }

            .home-window-body {
                padding: 28px 18px;
            }

            .home-window-body h1 {
                font-size: 27px;
            }

            .home-window-body p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body class="home-page">
<header class="top-bar">
    <div class="profile"><img src="./profile.png" alt="까치치킨사장님"></div>
    <div class="title">까치치킨사장님 공식 홈페이지</div>
    <div class="header-actions">
        <a class="admin-button" href="./index.html#news">로그인</a>
    </div>
</header>
<div class="header-line"></div>

<button id="home-menu-toggle" class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
</button>
<div id="home-sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

<aside id="home-sidebar" class="sidebar">
    <a class="menu-item active" href="./home.html">홈</a>
    <a class="menu-item" href="./index.html#news" data-target="news">소식</a>
    <a class="menu-item" href="./index.html#sports" data-target="sports">스포츠소식</a>
    <a class="menu-item" href="./index.html#community" data-target="community">관리자 커뮤니티</a>
    <a class="menu-item" href="./index.html#donation" data-target="donation">후원</a>
    <div class="menu-membership-divider" aria-hidden="true">멤버십 전용</div>
    <a class="menu-item locked" href="./index.html#video" data-target="video">영상미리보기 🔒</a>
    <a class="menu-item locked" href="./index.html#advanced" data-target="advanced">고급소식 🔒</a>
</aside>

<main class="home-page-main">
    <section class="home-window">
        <div class="home-window-title">홈</div>
        <div class="home-window-body">
            <h1>까치치킨사장님 공식 홈페이지</h1>
            <p>홈페이지에 오신 것을 환영합니다.</p>
            <a
                class="youtube-link"
                href="https://www.youtube.com/@magpie-chicken"
                target="_blank"
                rel="noopener noreferrer"
            >
                까치치킨사장님 유튜브 링크
            </a>
        </div>
    </section>
</main>

<script>
(() => {
    const toggle = document.getElementById('home-menu-toggle');
    const sidebar = document.getElementById('home-sidebar');
    const overlay = document.getElementById('home-sidebar-overlay');

    function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
    }

    toggle.addEventListener('click', () => {
        const open = !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', open);
        overlay.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', String(open));
    });

    overlay.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
    });

    sidebar.querySelectorAll('a[data-target]').forEach(a => {
        a.addEventListener('click', (event) => {
            event.preventDefault();
            const target = a.dataset.target;
            closeMenu();
            window.location.assign(`./index.html#${target}`);
        });
    });

    sidebar.querySelector('a[href="./home.html"]').addEventListener('click', closeMenu);
})();
</script>
</body>
</html>
